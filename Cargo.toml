[package]
name = "rust_ibkr_api_restful"
version = "0.1.0"
edition = "2021"

[dependencies]
# HTTP client for IBKR API
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }

# JSON serialization/deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
csv = "1.4.0"

# Technical Analysis - use stable version
ta = "0.5.0"

[dev-dependencies]
